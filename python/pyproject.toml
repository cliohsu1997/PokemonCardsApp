[tool.poetry]
name = "pokemon-cards-app"
version = "0.1.0"
description = "Pokémon card price Streamlit app (PriceCharting) and SQL practice workspace."
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
streamlit = "*"
pandas = "*"
beautifulsoup4 = "*"
requests = "*"
huggingface-hub = "*"
langchain = "0.0.234"
pydantic = "*"
tabulate = "*"
sentence-transformers = "*"
faiss-cpu = "*"
selenium = "*"
webdriver-manager = "*"
google-cloud-storage = "*"
plotly = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["test"]
